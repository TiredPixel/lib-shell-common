---
services:
  # make format binds the tree's own paths over the copy at run time.
  tooling:
    build: &tooling_build
      args:
        USER_GID: ${DC_GID:-1000}
        USER_UID: ${DC_UID:-1000}
      context: .
      target: test
    init: true
    network_mode: none
    profiles:
      - test
    user: ${DC_BIND_USER:-}
  # No mount, so what a run checks cannot change under it.
  tooling_test:
    build: *tooling_build
    environment:
      PYTEST_XDIST_AUTO_NUM_WORKERS: ${PYTEST_XDIST_AUTO_NUM_WORKERS:-}
    init: true
    network_mode: none
    profiles:
      - test
