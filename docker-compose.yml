# The services make runs.
services:
  # Runs bin/format, whose rewrites have to reach the host tree, which only this
  # mount carries there. The whole tree is bound rather than file by file, since
  # a single-file bind pins an inode and goes stale when an editor saves by
  # rename.
  shell:
    build:
      context: .
      target: dev
    init: true
    network_mode: none
    profiles:
      - test
    user: ${DC_BIND_USER:-}
    volumes:
      - .:/home/x/r
  # Runs bin/lint and bin/test on the tree the test stage copied: no mount, so
  # what a run checks cannot change under it. init, as PID 1, passes make test's
  # signals on, where bin/test as PID 1 would ignore a TERM or INT it sets no
  # trap for.
  shell_test:
    build:
      context: .
      target: test
    init: true
    network_mode: none
    profiles:
      - test
