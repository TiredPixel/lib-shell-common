---
# TRACK USES actions/checkout@v7
# TRACK USES actions/create-github-app-token@v3
# One run at a time per pull request, none cancelled once running: each reads
# the pull request afresh, so the last posts its current state. Waiting runs
# queue rather than the newest cancelling the one waiting, since only a
# pull_request_target run puts the review check on the head, and only a
# synchronize run gives the head the push moved the pull request from.
concurrency:
  cancel-in-progress: false
  group: review-${{ github.event.number || github.event.issue.number }}
  queue: max
jobs:
  review:
    # A comment on a plain issue has no checks to post, and the gate fails on a
    # number naming no pull request.
    if: github.event.pull_request || github.event.issue.pull_request
    # Contents read for the checkout alone: the checks are written with the
    # review app's token, since GitHub counts a check run towards a required
    # check only from the app the rule names.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # The default branch's code, never the pull request's, whose author could
      # otherwise run code holding the review app's token.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      # Minted here, in the workflow only a person may change, so the key never
      # leaves the workflow.
      - id: token
        name: Mint review app token
        # A full commit SHA cannot be wrapped.
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.REVIEW_APP_CLIENT_ID }}
          permission-checks: write
          permission-pull-requests: read
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
      - name: Post review checks
        uses: ./github/review
        with:
          app: ${{ steps.token.outputs.app-slug }}
          checks: ${{ vars.REVIEW_GATE_CHECKS }}
          token: ${{ steps.token.outputs.token }}
    timeout-minutes: 5
name: Review
"on":
  issue_comment:
    types:
      - created
      - deleted
      - edited
  # Runs the default branch's copy, so a pull request cannot change the workflow
  # to take the key; a public repository needs an Actions event policy allowing
  # this event explicitly (lib-shell-common's README, Setting a repository up).
  pull_request_target:
    types:
      # Closing a pull request lets another open one on the same head commit,
      # whose checks it shared, pass.
      - closed
      # A change of base raises edited, and a review of the diff against the old
      # base no longer counts.
      - edited
      - opened
      - ready_for_review
      - reopened
      # A push leaves any other pull request on the old head free to pass.
      - synchronize
